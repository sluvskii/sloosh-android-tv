name: Build & Release Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/sloosh-tv-debug.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sloosh-tv-debug.apk
          path: release-output/sloosh-tv-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (Latest)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Sloosh Android TV (Latest Release)"
          body: |
            🚀 **Автоматическая сборка Sloosh для Android TV**
            
            - Готовый файл `sloosh-tv-debug.apk` прикреплен ниже.
            - Коммит: `${{ github.event.head_commit.message }}`
          draft: false
          prerelease: false
          make_latest: "true"
          files: release-output/sloosh-tv-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
