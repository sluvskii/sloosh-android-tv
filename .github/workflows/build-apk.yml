name: Build & Release Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore (if provided via secret)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keys
          echo "$KEYSTORE_BASE64" | base64 --decode > keys/slooshkey
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/release/"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release-output/sloosh-tv-release.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sloosh-tv-release.apk
          path: release-output/sloosh-tv-release.apk
          if-no-files-found: error

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.5"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}
          name: ${{ format('Sloosh Android TV v{0}', steps.app_version.outputs.version) }}
          body: |
            🚀 **Релизная сборка Sloosh для Android TV (v${{ steps.app_version.outputs.version }})**

            - Готовый файл `sloosh-tv-release.apk` прикреплен ниже.
            - Коммит: `${{ github.event.head_commit.message }}`
          draft: false
          prerelease: false
          make_latest: "true"
          files: release-output/sloosh-tv-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
