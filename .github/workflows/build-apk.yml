name: Build & Release Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore (if provided via secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keys
            echo "$KEYSTORE_BASE64" | base64 --decode > keys/slooshkey
            echo "Keystore decoded successfully"
          else
            echo "Warning: KEYSTORE_BASE64 secret is not set"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --build-cache --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/release/"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release-output/sloosh-tv-release.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sloosh-tv-release.apk
          path: release-output/sloosh-tv-release.apk
          if-no-files-found: error

      - name: Extract App Version
        id: app_version
        run: |
          BASE_VERSION=$(grep -E 'val\s+baseVersion\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="2.0"
          fi
          BUILD_NUM=$(git rev-list --count HEAD)
          VERSION="${BASE_VERSION}.${BUILD_NUM}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          TAG="v${VERSION}"
          echo "Publishing GitHub release for $TAG..."
          gh release create "$TAG" release-output/sloosh-tv-release.apk \
            --title "Sloosh Android TV $TAG" \
            --notes "Версия $VERSION" \
            --target "${{ github.sha }}" \
            --latest || gh release upload "$TAG" release-output/sloosh-tv-release.apk --clobber || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
